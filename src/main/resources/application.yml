spring:
  application:
    name: codetrack-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codetrack}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-256-bits}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  platforms:
    codeforces:
      api-url: ${CODEFORCES_API_URL:https://codeforces.com/api/user.info}
      status-url: ${CODEFORCES_STATUS_URL:https://codeforces.com/api/user.status}
    leetcode:
      graphql-url: ${LEETCODE_GRAPHQL_URL:https://leetcode.com/graphql}
    codechef:
      ratings-url: ${CODECHEF_RATINGS_URL:https://www.codechef.com/api/ratings/all}
      profile-url: ${CODECHEF_PROFILE_URL:https://www.codechef.com/users/}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

codetrack:
  sync:
    request-delay-ms: ${CODETRACK_SYNC_REQUEST_DELAY_MS:1000}

logging:
  level:
    root: INFO
    com.codetrack: DEBUG
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
